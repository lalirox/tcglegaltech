<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>LEGAL TECH TCG</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
          tailwind.config = {
            darkMode: "class",
            theme: {
              extend: {
                colors: {
                  "surface": "#0a0e14",
                  "surface-container": "#151a21",
                  "surface-bright": "#262c36",
                  "on-secondary-container": "#e8fbff",
                  "on-surface-variant": "#a8abb3",
                  "surface-container-low": "#0f141a",
                  "surface-container-highest": "#20262f",
                  "on-surface": "#f1f3fc",
                  "secondary": "#00e3fd",
                  "primary": "#ffd96f",
                  "primary-fixed": "#fcc800",
                  "outline-variant": "#44484f",
                },
                fontFamily: {
                  "headline": ["Space Grotesk"],
                  "body": ["Inter"],
                  "label": ["Space Grotesk"]
                },
              },
            },
          }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .scanline-overlay {
            background: linear-gradient(to bottom, transparent 50%, rgba(241, 243, 252, 0.02) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }
        .chamfer-clip { clip-path: polygon(10px 0%, 100% 0%, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0% 100%, 0% 10px); }
        
        .card-perspective { perspective: 1000px; }
        .card-interactive {
            transform-style: preserve-3d;
            transition: box-shadow 0.3s ease, filter 0.3s ease, transform 0.1s ease-out;
            will-change: transform;
            backface-visibility: hidden;
        }

        /* CAPA DE BRILLO HOLOGRÁFICO */
        .glare-effect {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            mix-blend-mode: color-dodge;
            z-index: 10;
            border-radius: inherit;
        }

        /* SOBRE SORPRESA */
        .pack-container { position: relative; width: 220px; height: 310px; perspective: 1200px; cursor: pointer; margin-top: 60px; }
        .pack-container .card-surprise {
            position: absolute; width: 100%; height: 100%; border-radius: 12px; background-size: cover; background-position: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.8); z-index: 2; transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.15); transform: translateY(0) scale(0.95);
        }
        .pack-front {
            position: absolute; width: 100%; height: 100%; background: linear-gradient(135deg, #ffd96f 0%, #fcc800 100%);
            border-radius: 10px; z-index: 3; display: flex; justify-content: center; align-items: center; color: #0a0e14; font-size: 20px; font-weight: 900; box-shadow: inset 0 0 20px rgba(0,0,0,0.2); transition: transform 0.6s ease; transform-origin: bottom;
        }
        .pack-container:hover .card-surprise { transform: translateY(-115%) scale(1.1) rotateZ(3deg); z-index: 5; }
        .pack-container:hover .pack-front { transform: rotateX(20deg); }

        /* MÁQUINA DE GARRA */
        .claw-machine-wrap {
            width: 320px; height: 450px; background: #151a21; border: 6px solid #262c36; border-radius: 12px 12px 0 0;
            position: relative; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.6);
        }
        .claw-glass-area { position: absolute; inset: 10px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); overflow: hidden; }
        #main-claw-arm {
            position: absolute; top: 0; left: 50%; width: 2px; height: 40px; background: #ffd96f;
            transition: left 0.8s ease, height 0.8s ease; z-index: 50;
        }
        #main-claw-hook { position: absolute; bottom: -18px; left: -14px; font-size: 24px; transform: rotate(180deg); filter: drop-shadow(0 0 5px #ffd96f); }
        #mini-caught-card { position: absolute; top: 25px; left: 50%; transform: translateX(-50%); width: 40px; height: 56px; border: 1px solid #ffd96f; z-index: 45; display: none; object-fit: cover; }
        .claw-pile-container { position: absolute; bottom: 0; width: 100%; height: 70px; pointer-events: none; }
    </style>
</head>
<body class="bg-surface text-on-surface font-body">

<nav class="fixed top-0 z-40 flex justify-between items-center w-full px-4 md:px-6 py-4 bg-slate-950/80 backdrop-blur-xl">
    <div class="text-xl md:text-2xl font-black italic text-[#FFCB05] drop-shadow-[0_0_8px_rgba(255,203,5,0.5)] font-headline">Legal Tech TCG</div>
    <div class="flex items-center gap-4">
        <span class="material-symbols-outlined text-on-surface-variant hover:text-primary cursor-pointer transition-colors" onclick="document.getElementById('sideCartPanel').classList.remove('translate-x-full')">shopping_cart</span>
        <div class="w-10 h-10 bg-surface-container-highest border border-outline-variant rounded-full overflow-hidden">
            <img class="w-full h-full object-cover" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Trainer1"/>
        </div>
    </div>
</nav>

<main class="relative min-h-screen pt-28 pb-12 px-4 md:px-12 lg:px-24">
    <div class="fixed inset-0 scanline-overlay z-10"></div>

    <!-- Hero Card -->
    <section class="relative mb-20 z-20">
        <div class="grid lg:grid-cols-2 gap-12 items-center">
            <div class="space-y-6 text-center lg:text-left">
                <h1 class="text-5xl md:text-7xl font-headline font-black uppercase italic tracking-tighter">Cartas <span class="text-primary">Legendarias</span></h1>
                <p class="text-on-surface-variant">Colecciona el mazo definitivo del sector Legal Tech.</p>
            </div>
            <div class="flex justify-center card-perspective">
                <div class="relative w-full max-w-[300px] aspect-[3/4] bg-surface-container-low rounded-xl border border-outline-variant/30 overflow-hidden card-interactive cursor-pointer">
                    <img class="w-full h-full object-contain" src="carta15.png" alt="Card"/>
                </div>
            </div>
        </div>
    </section>

    <!-- Inventario -->
    <section class="mb-24 relative z-20">
        <h2 class="text-3xl font-headline font-black uppercase mb-10">Inventario <span class="text-primary">Actualizado</span></h2>
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <!-- Las cartas se inyectarán aquí para ahorrar espacio o puedes dejarlas manuales -->
            <script>
                const myCards = ["carta1.jpg", "carta2.jpeg", "carta3.jpeg", "carta4.jpeg", "carta5.jpeg", "carta6.jpeg", "carta7.jpeg", "Carta8.jpeg", "carta9.jpeg", "carta10.jpeg", "carta11.jpeg", "carta12.png", "13.png", "carta14.png", "carta15.png", "doffiekang.jpeg"];
                myCards.forEach(c => {
                    document.write(`
                        <div class="card-interactive aspect-[3/4] bg-surface-container-highest border border-outline-variant/50 relative p-1 group cursor-pointer overflow-hidden rounded">
                            <img class="w-full h-full object-cover" src="${c}">
                            <div class="absolute bottom-0 left-0 right-0 bg-primary/90 text-black text-[9px] font-black text-center py-2 translate-y-full group-hover:translate-y-0 transition-transform uppercase italic">ADQUIRIR</div>
                        </div>
                    `);
                });
            </script>
        </div>
    </section>

    <!-- POKEDEX & MYSTERY PACK -->
    <div class="flex flex-col lg:flex-row justify-center items-center py-16 gap-16 lg:gap-32 relative z-20">
        <svg id="pokedexElement" width="180" height="240" viewBox="0 0 150 200" fill="none" class="cursor-pointer">
            <rect x="10" y="10" width="130" height="180" rx="15" fill="#dc2626"/>
            <circle cx="45" cy="40" r="14" fill="#3b82f6" class="animate-pulse"/>
            <rect x="25" y="100" width="100" height="65" rx="5" fill="#1e293b"/>
            <image id="pokedexScreenImg" x="35" y="110" width="80" height="45" opacity="0" href=""/>
        </svg>

        <div class="pack-container">
            <div class="pack-front">MYSTERY PACK</div>
            <div class="card-surprise" id="randomCardElement"></div>
        </div>
    </div>

    <!-- MÁQUINA DE GARRA -->
    <div class="flex flex-col items-center py-20 relative z-20">
        <h2 class="text-3xl font-headline font-black uppercase text-secondary mb-10 drop-shadow-[0_0_15px_rgba(0,227,253,0.3)]">🕹️ La Garra Legal Tech</h2>
        <div class="claw-machine-wrap">
            <div class="claw-glass-area">
                <div id="main-claw-arm">
                    <div id="main-claw-hook">🏗️</div>
                    <img id="mini-caught-card" src="">
                </div>
                <img id="claw-card-won" src="" class="card-interactive rounded border-2 border-primary shadow-2xl" style="position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0); z-index: 100; width: 170px;">
                <div id="claw-pile" class="claw-pile-container"></div>
            </div>
            <div class="absolute bottom-0 w-full h-16 bg-surface-container-highest border-t border-outline-variant flex items-center justify-center">
                <button id="startClawGame" onclick="runClawLogic()" class="px-8 py-2 bg-primary text-black font-black uppercase text-xs chamfer-clip hover:bg-white active:scale-90">Lanzar Garra</button>
            </div>
        </div>
    </div>
</main>

<!-- Carrito -->
<div id="sideCartPanel" class="fixed top-0 right-0 h-full w-80 bg-surface-container z-[150] transform translate-x-full transition-transform p-5 border-l border-outline-variant">
    <div class="flex justify-between items-center mb-6">
        <h2 class="font-headline font-bold text-primary">CARRITO</h2>
        <button onclick="document.getElementById('sideCartPanel').classList.add('translate-x-full')">✕</button>
    </div>
    <div id="cartItemsContainer" class="space-y-4"></div>
</div>

<script>
    const mysteryImages = ["carta1.jpg", "carta2.jpeg", "carta3.jpeg", "carta4.jpeg", "carta5.jpeg", "carta6.jpeg", "carta7.jpeg", "Carta8.jpeg", "carta9.jpeg", "carta10.jpeg", "carta11.jpeg", "carta12.png", "13.png", "carta14.png", "carta15.png", "doffiekang.jpeg"];

    document.addEventListener("DOMContentLoaded", () => {
        // --- 1. EFECTOS VISUALES DE LAS CARTAS (Restaurados) ---
        const cards = document.querySelectorAll(".card-interactive");
        cards.forEach(card => {
            const glare = document.createElement("div");
            glare.classList.add("glare-effect");
            card.appendChild(glare);

            card.addEventListener("mousemove", (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -15;
                const rotateY = ((x - centerX) / centerX) * 15;

                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05, 1.05, 1.05)`;
                
                const glareX = (x / rect.width) * 100;
                const glareY = (y / rect.height) * 100;
                glare.style.background = `radial-gradient(circle at ${glareX}% ${glareY}%, rgba(255, 255, 255, 0.4) 0%, transparent 60%)`;
                glare.style.opacity = "1";
            });

            card.addEventListener("mouseleave", () => {
                card.style.transform = "rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)";
                glare.style.opacity = "0";
            });
        });

        // --- 2. LLENAR MÁQUINA DE GARRA (Físicas) ---
        const pile = document.getElementById('claw-pile');
        function initPile() {
            pile.innerHTML = '';
            for(let i=0; i<25; i++) {
                const img = document.createElement('img');
                img.src = mysteryImages[Math.floor(Math.random()*mysteryImages.length)];
                img.className = "absolute w-12 h-16 object-cover border border-white/10 rounded shadow-md";
                img.style.left = (Math.random()*85) + "%";
                img.style.bottom = (Math.random()*15 - 5) + "px";
                img.style.transform = `rotate(${Math.random()*60 - 30}deg)`;
                img.style.zIndex = Math.floor(Math.random()*10);
                pile.appendChild(img);
            }
        }
        initPile();

        // --- 3. LÓGICA DE LA GARRA ---
        window.runClawLogic = function() {
            const btn = document.getElementById('startClawGame');
            const arm = document.getElementById('main-claw-arm');
            const mini = document.getElementById('mini-caught-card');
            const big = document.getElementById('claw-card-won');
            
            btn.disabled = true;
            big.style.transform = 'translate(-50%, -50%) scale(0)';
            mini.style.display = 'none';
            
            const winImg = mysteryImages[Math.floor(Math.random()*mysteryImages.length)];
            const targetX = Math.floor(Math.random()*70) + 15;
            
            arm.style.left = targetX + "%";

            setTimeout(() => {
                arm.style.height = "340px";
                setTimeout(() => {
                    mini.src = winImg;
                    mini.style.display = 'block';
                    arm.style.height = "40px";
                    setTimeout(() => {
                        big.src = winImg;
                        big.style.transform = 'translate(-50%, -50%) scale(1)';
                        mini.style.display = 'none';
                        btn.disabled = false;
                        initPile();
                    }, 1000);
                }, 1000);
            }, 800);
        };

        // Mystery Pack Init
        document.getElementById('randomCardElement').style.backgroundImage = `url('${mysteryImages[0]}')`;
    });
</script>
</body>
</html>
